name: Release Artifacts

on:
  push:
    tags:
      # Match v1.0.0, v20.15.10, etc.
      - "v[0-9]+.[0-9]+.[0-9]+"
      # And release candidates: v1.0.0-rc1, v20.15.10-rc5, etc.
      - "v[0-9]+.[0-9]+.[0-9]+-rc*"

env:
  RUST_VERSION: "1.95.0"
  WASM_TARGET: "wasm32v1-none"
  CARGO_TERM_COLOR: always

jobs:
  release-artifacts:
    name: Build and publish release wasm
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ env.WASM_TARGET }}

      - name: Cache cargo registry + build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: true
          cache-on-failure: false

      - name: Build release wasm
        run: make build

      - name: Generate sha256 checksums
        working-directory: target/${{ env.WASM_TARGET }}/release
        run: |
          sha256sum *.wasm > checksums.txt
          echo "----- checksums.txt -----"
          cat checksums.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.JAKUB_SECRET_CI }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "target/${WASM_TARGET}/release/"*.wasm \
            "target/${WASM_TARGET}/release/checksums.txt" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
